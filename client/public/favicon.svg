<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f0f0f"/>
  <!-- Guitar body -->
  <ellipse cx="16" cy="22" rx="7" ry="6" fill="#f59e0b"/>
  <!-- Guitar neck -->
  <rect x="15" y="6" width="2" height="12" rx="1" fill="#f59e0b"/>
  <!-- Tuning head -->
  <rect x="13" y="4" width="6" height="4" rx="1" fill="#f59e0b"/>
  <!-- Sound hole -->
  <circle cx="16" cy="22" r="2" fill="#0f0f0f"/>
  <!-- Strings -->
  <line x1="16" y1="6" x2="16" y2="19" stroke="#e8e0d0" stroke-width="0.5" opacity="0.6"/>
</svg>
